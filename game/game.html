<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merdeka Math Journey - 32x32 Pixel Edition</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link href="game.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />
    <link rel="stylesheet" href="../archivement_helper.css" />
  </head>
  <body
    class="min-h-screen flex flex-col justify-between items-center p-3 md:p-6"
  >
    <a class="return" href="../menu/menu.html"></a>

    <!-- Header HUD -->
    <header
      class="w-full max-w-6xl arcade-card p-4 mb-4 flex flex-col md:flex-row justify-between items-center"
    >
      <div class="flex items-center gap-3 mb-2 md:mb-0">
        <div
          class="w-12 h-12 border-2 flex items-center justify-center pixel-font text-2xl font-bold"
          style="
            background-color: var(--red-bright);
            border-color: var(--color-white);
            color: var(--yellow);
          "
        >
          🇲🇾
        </div>
        <div>
          <h1
            class="pixel-font text-sm md:text-xl tracking-wider"
            style="color: var(--yellow)"
          >
            MERDEKA MATH JOURNEY
          </h1>
          <p class="text-xs md:text-sm" style="color: var(--blue-pale)">
            Form 5 Math Chapter 5: Combined Transformations
          </p>
        </div>
      </div>

      <div class="flex items-center gap-4 text-sm pixel-font">
        <div
          class="px-3 py-1 border text-center"
          style="
            background-color: var(--color-dark-purple);
            border-color: var(--gold);
          "
        >
          <span class="block text-[10px]" style="color: var(--yellow)"
            >STAGE</span
          >
          <span id="level-num" class="text-lg" style="color: var(--color-white)"
            >1 / 7</span
          >
        </div>
        <div
          class="px-3 py-1 border text-center"
          style="
            background-color: var(--color-dark-purple);
            border-color: var(--gold);
          "
        >
          <span class="block text-[10px]" style="color: var(--yellow)"
            >SCORE</span
          >
          <span
            id="score-val"
            class="text-lg"
            style="color: var(--green-bright)"
            >0000</span
          >
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main
      class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-5 flex-1"
    >
      <!-- Canvas Display -->
      <div class="lg:col-span-8 flex flex-col items-center w-full">
        <div
          class="relative w-full aspect-square max-h-[580px] border-4 shadow-xl overflow-hidden crt-screen flex items-center justify-center"
          style="
            background-color: var(--color-dark-purple);
            border-color: var(--red);
          "
        >
          <canvas
            id="mathCanvas"
            width="600"
            height="600"
            class="w-full h-full cursor-crosshair block"
          ></canvas>

          <!-- Stage Victory Overlay -->
          <div
            id="toast-modal"
            class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-20 transition-opacity duration-300 opacity-0 pointer-events-none"
            style="background-color: rgba(255, 255, 255, 0.95)"
          >
            <h2
              id="toast-heading"
              class="pixel-font text-xl md:text-2xl mb-2"
              style="color: var(--yellow)"
            >
              STAGE CLEAR!
            </h2>
            <p
              id="toast-text"
              class="text-lg md:text-xl mb-6 max-w-md"
              style="color: var(--color-pale-mint)"
            >
              Transformation completed successfully!
            </p>
            <button
              id="next-lvl-btn"
              onclick="goToNextLevel()"
              class="arcade-btn px-6 py-3 text-xs md:text-sm border-2"
              style="
                background-color: var(--gold);
                color: var(--color-ink);
                border-color: var(--color-ink);
              "
            >
              NEXT HISTORICAL STAGE
            </button>
          </div>
        </div>

        <!-- Canvas Legend -->
        <div
          class="w-full border-2 p-2.5 mt-2 flex flex-wrap justify-between items-center text-xs md:text-sm"
          style="
            background-color: #b8e5ff;
            border-color: var(--color-muted-purple);
          "
        >
          <div class="flex items-center gap-3">
            <span class="flex items-center gap-1">
              <span
                class="inline-block w-3 h-3 border"
                style="background-color: #ffdf00; border-color: #0033a0"
              ></span>
              Object (Yellow)
            </span>
            <span class="flex items-center gap-1">
              <span
                class="inline-block w-3 h-3 border"
                style="background-color: #ce1126; border-color: #0033a0"
              ></span>
              Target (Red)
            </span>
            <span class="flex items-center gap-1">
              <span
                class="inline-block w-3 h-3 border"
                style="background-color: #0033a0; border-color: #0033a0"
              ></span>
              Your Result (Yellow)
            </span>
          </div>
        </div>
      </div>

      <!-- Controls & Story Panel -->
      <div class="lg:col-span-4 flex flex-col gap-4 w-full">
        <div class="arcade-card p-4 flex flex-col gap-4">
          <div class="border-b-2 pb-2" style="border-color: var(--yellow)">
            <h3
              id="type-header"
              class="pixel-font text-xs"
              style="color: var(--yellow)"
            >
              TRANSFORMATION CONTROLS
            </h3>
          </div>

          <div id="controls-container" class="flex flex-col gap-3"></div>

          <button
            onclick="checkAnswer()"
            class="w-full arcade-btn py-3 text-xs md:text-sm border-2"
            style="
              background-color: var(--red);
              color: var(--color-white);
              border-color: var(--yellow);
            "
          >
            EXECUTE TRANSFORMATION!
          </button>
        </div>

        <div
          class="arcade-card p-4"
          style="background-color: var(--color-dark-purple)"
        >
          <h4
            class="pixel-font text-xs mb-2 flex items-center gap-2"
            style="color: var(--yellow)"
          >
            <span
              class="inline-block w-2.5 h-2.5"
              style="background-color: var(--red)"
            ></span>
            HISTORICAL CONTEXT
          </h4>
          <p
            id="stage-title-text"
            class="pixel-font text-xs mb-2"
            style="color: var(--gold)"
          ></p>
          <p
            id="historical-fact-text"
            class="text-sm leading-relaxed mb-3 italic"
            style="
              color: var(--color-pale-mint);
              border-left: 2px solid var(--yellow);
              padding-left: 8px;
            "
          ></p>
          <p
            id="stage-objective-text"
            class="text-sm leading-relaxed"
            style="color: var(--color-white)"
          ></p>
        </div>

        <div class="flex justify-between items-center px-1 text-xs">
          <button
            onclick="resetLevel()"
            class="px-3 py-1.5 border-2 hover:border-yellow-400"
            style="
              background-color: var(--color-dark-purple);
              border-color: #0033a0;
              color: var(--color-white);
              outline: 2px solid #0033a0;
            "
          >
            🔄 Reset Stage
          </button>
        </div>
      </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="../archivement_helper.js"></script>
    <script src="game.js"></script>
  </body>
</html>
